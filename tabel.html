<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table responsive</title>
    <style>
    table {
        border-collapse: collapse;
        width: 100%;
        white-space: nowrap;
    }
    th, td {
        padding: 10px;
        border-bottom: 1px solid #cbd5e1;
        text-align: left;
    }

    tr:nth-child(even) {
        background-color: #f1f5f9;
    }  
    tr:hover {
        background-color: #fef08a;
    }
</style>
</head>
<body>

<div style="overflow-x: auto;">
    <table>
    <tr style="background-color: #0284c7; color: black;">
        <th>no</th>
        <th>nama</th>
        <th>nilai tugas 1</th>
        <th>nilai tugas 2</th>
        <th>status akhir pembelajaran</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Iput kotak</td>
        <td>88</td>
        <td>92</td>
        <td>LULUS (tabel sangat luas)</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Titut Ompong</td>
        <td>90</td>
        <td>95</td>
        <td>LULUS (dapat di-scroll di HP)</td>
    </tr>
</table>
</div>
</body>
</html>
